name: SelfOS Application CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-application:
    name: Application Quality Gates (Lint, Typecheck, Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime & NPM Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lockfile Integrity Check
        run: test -f package-lock.json

      - name: Fast Gate 1: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Fast Gate 2: ESLint Static Audit
        run: npx expo lint

      - name: Gate 3: Execute Unit & Integration Test Suites
        run: |
          npx tsx src/shared/utils/__tests__/validators.test.ts
          npx tsx src/shared/utils/__tests__/mappers.test.ts
          npx tsx src/shared/offline/__tests__/offline-infrastructure.test.ts
          npx tsx src/shared/notifications/__tests__/notifications.test.ts
          npx tsx src/shared/observability/__tests__/observability.test.ts
          npx tsx __tests__/repository/routine.repository.test.ts
          npx tsx __tests__/react-query/react-query.test.ts
          npx tsx __tests__/e2e/e2e-suite.test.ts

      - name: Generate CI Summary Report
        if: always()
        run: |
          echo "## 🚀 SelfOS CI Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Strict Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Static Audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & Integration Test Suites | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| End-to-End Workflows | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
