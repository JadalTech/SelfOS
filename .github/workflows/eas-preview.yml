name: SelfOS Expo EAS Build & Release Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eas-build-preview:
    name: Build EAS Internal Preview Binary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Validate EAS Config
        run: npx eas build:inspect --platform all --profile preview

  eas-build-production:
    name: Build EAS Production Binary
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Inspect Production Build Config
        run: npx eas build:inspect --platform all --profile production
